<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Ide &amp; Prompt — Muhammad Fajar Nurkholiq</title>
<meta name="description" content="Kumpulan gambar AI-generated beserta prompt-nya, oleh Muhammad Fajar Nurkholiq.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17120F;
    --bg-card: #241B16;
    --text: #F1E9DC;
    --text-muted: #B7A695;
    --accent: #AE3E33;
    --accent-warm: #CBA872;
    --border: rgba(241,233,220,0.09);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  .engrave-bg{ position: fixed; inset: 0; z-index: 0; opacity: 0.06; pointer-events: none; }

  main{ position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 4rem 1.5rem 6rem; }

  .eyebrow{ color: var(--accent-warm); font-size: 0.8rem; letter-spacing: 0.04em; margin-bottom: 0.85rem; }
  h1{ font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.25; margin-bottom: 1rem; }
  .desc{ color: var(--text-muted); font-size: 0.95rem; max-width: 60ch; margin-bottom: 2rem; }

  .filters{ display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2rem; }
  .filter-btn{
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.83rem; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: border-color 0.2s ease, color 0.2s ease;
  }
  .filter-btn.active{ border-color: var(--accent); color: var(--text); background: rgba(174,62,51,0.12); }

  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }

  .card{
    position: relative; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .card:hover{ border-color: var(--accent); transform: translateY(-2px); }
  .card img{ width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #2a201a; }
  .card-body{ padding: 0.85rem 1rem; }
  .card-title{ font-size: 0.92rem; font-weight: 500; margin-bottom: 0.3rem; }
  .card-cat{ font-size: 0.72rem; color: var(--accent-warm); }

  .card-admin-controls{
    position: absolute; top: 0.5rem; right: 0.5rem;
    display: flex; gap: 0.35rem; z-index: 2;
  }
  .icon-btn{
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(23,18,15,0.85); border: 1px solid var(--border);
    color: var(--text); font-size: 0.85rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover{ border-color: var(--accent); }

  .empty-state{
    background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px;
    padding: 2.5rem 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;
  }
  .empty-state strong{ color: var(--text); }
  .error-state{
    background: var(--bg-card); border: 1px solid var(--accent); border-radius: 12px;
    padding: 1.5rem; color: var(--text-muted); font-size: 0.88rem;
  }

  .modal-overlay{
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 20; padding: 1.5rem; overflow-y: auto;
  }
  .modal-overlay.open{ display: flex; align-items: flex-start; justify-content: center; }
  .modal{
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    max-width: 480px; width: 100%; margin-top: 2rem; overflow: hidden;
  }
  .modal img{ width: 100%; display: block; }
  .modal-body{ padding: 1.5rem; }
  .modal-title{ font-family: 'Fraunces', serif; font-size: 1.25rem; margin-bottom: 1rem; }
  .modal-prompt{
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem; font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1rem;
  }
  .modal-actions{ display: flex; gap: 0.6rem; }
  .modal-btn{
    flex: 1; background: transparent; border: 1px solid var(--border); color: var(--accent-warm);
    padding: 0.7rem; border-radius: 8px; font-size: 0.82rem; font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .modal-btn:hover{ border-color: var(--accent-warm); }
  .modal-btn.primary{ background: var(--accent); color: var(--text); border-color: var(--accent); }

  .field{ margin-bottom: 1rem; }
  .field label{ display: block; font-size: 0.8rem; color: var(--accent-warm); margin-bottom: 0.4rem; }
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="password"],
  .field textarea{
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 0.75rem; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); }
  .field textarea{ min-height: 80px; resize: vertical; }
  .field input[type="file"]{ font-size: 0.82rem; color: var(--text-muted); }

  .form-error{ color: var(--accent); font-size: 0.82rem; margin-bottom: 1rem; display: none; }

  .fab{
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 15;
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent);
    color: var(--text); border: none; font-size: 1.6rem; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .fab.visible{ display: flex; }

  footer{ margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); }
  footer a{ color: var(--accent-warm); cursor: pointer; }
</style>
</head>
<body>

<svg class="engrave-bg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="engrave" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="#F1E9DC" stroke-width="0.35"/>
      <circle cx="8" cy="8" r="3.8" fill="none" stroke="#F1E9DC" stroke-width="0.25"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#engrave)"/>
</svg>

<main>
  <p class="eyebrow mono">&gt; log galeri</p>
  <h1>Galeri Ide &amp; Prompt</h1>
  <p class="desc">Kumpulan gambar AI-generated beserta prompt yang dipakai buat bikinnya.</p>

  <div class="filters" id="filters"></div>
  <div id="content"><div class="empty-state mono">Memuat galeri...</div></div>

  <footer class="mono">
    Bagian dari portofolio Muhammad Fajar Nurkholiq.
    <a href="https://fajarnurkholiq.github.io/portofolio-saya/">Lihat portofolio utama →</a>
    &nbsp;|&nbsp;
    <a id="authLink">Masuk</a>
  </footer>
</main>

<button class="fab" id="fabAdd">+</button>

<!-- Modal: lihat detail gambar -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <img id="viewImg" src="" alt="">
    <div class="modal-body">
      <p class="modal-title" id="viewTitle"></p>
      <p class="modal-prompt mono" id="viewPrompt"></p>
      <div class="modal-actions">
        <button class="modal-btn" id="copyPromptBtn">salin prompt</button>
        <button class="modal-btn" id="closeViewBtn">tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: tambah/edit entri -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-body">
      <p class="modal-title" id="editModalTitle">Tambah Gambar</p>
      <p class="form-error" id="editError"></p>
      <div class="field">
        <label>Judul</label>
        <input type="text" id="fieldJudul">
      </div>
      <div class="field">
        <label>Kategori</label>
        <input type="text" id="fieldKategori" placeholder="misal: Visual, Karakter, dll">
      </div>
      <div class="field">
        <label>Prompt</label>
        <textarea id="fieldPrompt"></textarea>
      </div>
      <div class="field">
        <label id="fileLabel">Gambar</label>
        <input type="file" id="fieldGambar" accept="image/*">
      </div>
      <div class="modal-actions">
        <button class="modal-btn primary" id="saveEntryBtn">Simpan</button>
        <button class="modal-btn" id="closeEditBtn">Batal</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
  import {
    getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc
  } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
  import {
    getStorage, ref, uploadBytes, getDownloadURL, deleteObject
  } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js';

  // =====================================================================
  // GANTI DENGAN FIREBASE CONFIG KAMU SENDIRI (dari Project Settings)
  // =====================================================================
  const firebaseConfig = {
    apiKey: "GANTI_INI",
    authDomain: "GANTI_INI",
    projectId: "GANTI_INI",
    storageBucket: "GANTI_INI",
    messagingSenderId: "GANTI_INI",
    appId: "GANTI_INI"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const googleProvider = new GoogleAuthProvider();

  // Cuma akun dengan email ini yang dianggap admin.
  const OWNER_EMAIL = 'muhammadfajarn619@gmail.com';

  let allItems = [];
  let activeCategory = 'semua';
  let isAdmin = false;
  let editingId = null; // null = mode tambah, isi id = mode edit

  // ---------- Baca data galeri realtime ----------
  onSnapshot(collection(db, 'galeri'), (snapshot) => {
    allItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFilters();
    renderGrid();
  }, (err) => {
    document.getElementById('content').innerHTML = `<div class="error-state mono">Gagal muat galeri: ${err.message}</div>`;
  });

  // ---------- Auth state ----------
  onAuthStateChanged(auth, (user) => {
    if (user && user.email !== OWNER_EMAIL){
      // Bukan akun admin — tolak, sign out otomatis.
      signOut(auth);
      alert('Akun Google ini bukan akun admin.');
      return;
    }
    isAdmin = !!user;
    document.getElementById('authLink').textContent = isAdmin ? 'Keluar' : 'Masuk';
    document.getElementById('fabAdd').classList.toggle('visible', isAdmin);
    renderGrid();
  });

  document.getElementById('authLink').addEventListener('click', () => {
    if (isAdmin) {
      signOut(auth);
    } else {
      signInWithPopup(auth, googleProvider).catch((err) => {
        alert('Login gagal: ' + err.message);
      });
    }
  });

  // ---------- Render filter kategori ----------
  function renderFilters(){
    const categories = ['semua', ...new Set(allItems.map(i => i.kategori).filter(Boolean))];
    const el = document.getElementById('filters');
    el.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat === 'semua' ? 'Semua' : cat;
      btn.addEventListener('click', () => { activeCategory = cat; renderFilters(); renderGrid(); });
      el.appendChild(btn);
    });
  }

  // ---------- Render grid ----------
  function renderGrid(){
    const container = document.getElementById('content');

    if (allItems.length === 0){
      container.innerHTML = `<div class="empty-state"><strong>Galeri masih kosong.</strong><br>${isAdmin ? 'Tap tombol + di kanan bawah buat nambah.' : 'Belum ada gambar diupload.'}</div>`;
      return;
    }

    const filtered = activeCategory === 'semua' ? allItems : allItems.filter(i => i.kategori === activeCategory);
    if (filtered.length === 0){
      container.innerHTML = `<div class="empty-state">Belum ada gambar di kategori ini.</div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const adminControls = isAdmin ? `
        <div class="card-admin-controls">
          <button class="icon-btn" data-action="edit" data-id="${item.id}">✏️</button>
          <button class="icon-btn" data-action="delete" data-id="${item.id}">🗑️</button>
        </div>` : '';

      card.innerHTML = `
        ${adminControls}
        <img src="${item.gambar}" alt="${item.judul || ''}" loading="lazy">
        <div class="card-body">
          <div class="card-title">${item.judul || 'Tanpa judul'}</div>
          <div class="card-cat mono">${item.kategori || ''}</div>
        </div>`;

      card.querySelector('img').addEventListener('click', () => openViewModal(item));
      const editBtn = card.querySelector('[data-action="edit"]');
      const delBtn = card.querySelector('[data-action="delete"]');
      if (editBtn) editBtn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(item); });
      if (delBtn) delBtn.addEventListener('click', (e) => { e.stopPropagation(); handleDelete(item); });

      grid.appendChild(card);
    });

    container.innerHTML = '';
    container.appendChild(grid);
  }

  // ---------- Modal lihat detail ----------
  function openViewModal(item){
    document.getElementById('viewImg').src = item.gambar;
    document.getElementById('viewTitle').textContent = item.judul || 'Tanpa judul';
    document.getElementById('viewPrompt').textContent = item.prompt || '(prompt belum diisi)';
    document.getElementById('viewModal').classList.add('open');
  }
  document.getElementById('closeViewBtn').addEventListener('click', () => document.getElementById('viewModal').classList.remove('open'));
  document.getElementById('copyPromptBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('viewPrompt').textContent);
    const btn = document.getElementById('copyPromptBtn');
    const orig = btn.textContent;
    btn.textContent = 'tersalin!';
    setTimeout(() => btn.textContent = orig, 1500);
  });

  // ---------- Modal tambah/edit ----------
  document.getElementById('fabAdd').addEventListener('click', () => openEditModal(null));
  document.getElementById('closeEditBtn').addEventListener('click', () => document.getElementById('editModal').classList.remove('open'));

  function openEditModal(item){
    editingId = item ? item.id : null;
    document.getElementById('editModalTitle').textContent = item ? 'Edit Gambar' : 'Tambah Gambar';
    document.getElementById('fieldJudul').value = item ? (item.judul || '') : '';
    document.getElementById('fieldKategori').value = item ? (item.kategori || '') : '';
    document.getElementById('fieldPrompt').value = item ? (item.prompt || '') : '';
    document.getElementById('fieldGambar').value = '';
    document.getElementById('fileLabel').textContent = item ? 'Ganti gambar (opsional, kosongkan kalau tetap)' : 'Gambar';
    document.getElementById('editError').style.display = 'none';
    document.getElementById('editModal').classList.add('open');
  }

  document.getElementById('saveEntryBtn').addEventListener('click', async () => {
    const judul = document.getElementById('fieldJudul').value.trim();
    const kategori = document.getElementById('fieldKategori').value.trim();
    const prompt = document.getElementById('fieldPrompt').value.trim();
    const file = document.getElementById('fieldGambar').files[0];
    const errEl = document.getElementById('editError');
    const btn = document.getElementById('saveEntryBtn');

    if (!judul || (!file && !editingId)){
      errEl.textContent = 'Judul wajib diisi, dan gambar wajib buat entri baru.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Menyimpan...';
    btn.disabled = true;

    try {
      let gambarUrl = null;
      if (file){
        const path = `images/${Date.now()}-${file.name}`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        gambarUrl = await getDownloadURL(storageRef);
      }

      if (editingId){
        const updateData = { judul, kategori, prompt };
        if (gambarUrl) updateData.gambar = gambarUrl;
        await updateDoc(doc(db, 'galeri', editingId), updateData);
      } else {
        await addDoc(collection(db, 'galeri'), {
          judul, kategori, prompt, gambar: gambarUrl, dibuatPada: Date.now()
        });
      }

      document.getElementById('editModal').classList.remove('open');
    } catch (err) {
      errEl.textContent = 'Gagal menyimpan: ' + err.message;
      errEl.style.display = 'block';
    } finally {
      btn.textContent = 'Simpan';
      btn.disabled = false;
    }
  });

  async function handleDelete(item){
    if (!confirm(`Hapus "${item.judul || 'gambar ini'}"? Nggak bisa dibatalin.`)) return;
    try {
      await deleteDoc(doc(db, 'galeri', item.id));
      // Coba hapus file gambarnya juga dari Storage (best-effort, nggak fatal kalau gagal)
      try {
        const path = decodeURIComponent(new URL(item.gambar).pathname.split('/o/')[1].split('?')[0]);
        await deleteObject(ref(storage, path));
      } catch (e) { /* biarin, doc-nya udah kehapus, itu yang paling penting */ }
    } catch (err) {
      alert('Gagal menghapus: ' + err.message);
    }
  }
</script>

</body>
</html>
